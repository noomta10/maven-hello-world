name: CI/CD Pipeline

on:
  push:
    branches: [ "master", "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Bump Patch Version automatically
        run: |
          # Use Maven to automatically bump the patch version (1.0.0 -> 1.0.1)
          mvn build-helper:parse-version versions:set -DnewVersion=\${parsedVersion.majorVersion}.\${parsedVersion.minorVersion}.\${parsedVersion.nextIncrementalVersion} versions:commit
          NEW_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "VERSION=$NEW_VERSION" >> $GITHUB_ENV

      - name: Compile and Package Artifact
        run: mvn clean package

      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: java-app-artifact
          path: target/*.jar

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        run: |
          # Build the Docker image 
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/maven-hello-world:${{ env.VERSION }} .
          # Push the image to Docker Hub
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/maven-hello-world:${{ env.VERSION }}