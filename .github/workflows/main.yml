name: CI/CD Pipeline

on:
  push:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./myapp
    # Moving version to next job
    outputs:
      jar_version: ${{ steps.bump_version.outputs.VERSION }}
        
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Bump Patch Version automatically
        id: bump_version
        run: |
          mvn build-helper:parse-version versions:set -DnewVersion=\${parsedVersion.majorVersion}.\${parsedVersion.minorVersion}.\${parsedVersion.nextIncrementalVersion} versions:commit
          NEW_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "VERSION=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Compile and Package Artifact
        run: mvn clean package

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: java-app-artifact
          path: myapp/target/*.jar

  deploy:
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./myapp
        
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: java-app-artifact
          # Downloading the JAR exactly to the location the Dockerfile expects to find it
          path: myapp/target

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/maven-hello-world:${{ needs.build.outputs.jar_version }} .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/maven-hello-world:${{ needs.build.outputs.jar_version }}
